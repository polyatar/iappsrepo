<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">RepoTools | iApps</title>
    <meta name="robots" content="noindex, nofollow, noarchive">
    <link rel="icon" type="image/png" href="../Images/Profile.PNG">
    <link rel="apple-touch-icon" href="../Images/Profile.PNG">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --font: 'Inter', -apple-system, sans-serif; }
        [data-theme="dark"] {
            --bg: #0a0a0f; --bg-card: rgba(26,26,36,0.9); --border: rgba(255,255,255,0.08);
            --text: #fff; --text-muted: rgba(255,255,255,0.5); --accent: #6366f1;
        }
        [data-theme="light"] {
            --bg: #f8fafc; --bg-card: rgba(255,255,255,0.95); --border: rgba(0,0,0,0.08);
            --text: #0f172a; --text-muted: #64748b; --accent: #6366f1;
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: clamp(1rem, 5vw, 3rem);
            transition: all 0.3s;
        }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
        .back { display: flex; align-items: center; gap: 0.5rem; color: var(--text-muted); font-weight: 500; transition: color 0.2s; }
        .back:hover { color: var(--accent); }
        .back svg { fill: currentColor; }
        .theme-btn {
            width: 44px; height: 44px; border-radius: 12px; background: var(--bg-card);
            border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
            font-size: 1.25rem; cursor: pointer; transition: all 0.2s;
        }
        .theme-btn:hover { border-color: var(--accent); }
        .actions { display: flex; gap: 0.5rem; }
        .lang-btn { position: relative; color: var(--text-muted); }
        .lang-btn:hover { color: var(--accent); }
        .lang-code { position: absolute; right: 5px; bottom: 4px; font-size: 0.5rem; font-weight: 800; line-height: 1; color: var(--accent); pointer-events: none; }
        .page-title { max-width: 1000px; margin: 0 auto 1.5rem; font-size: clamp(1.5rem, 4vw, 2.25rem); font-weight: 800; letter-spacing: -0.02em; }
        .tool { max-width: 1000px; margin: 0 auto 2.5rem; }
        .tool__title { font-size: 0.8125rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 1rem; }
        .tool .container { max-width: none; }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
            gap: 1.5rem;
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(20px);
        }
        .card__title { font-size: 1.25rem; font-weight: 600; margin-bottom: 1.5rem; text-align: center; }
        .btn {
            display: flex; align-items: center; justify-content: center; width: 100%;
            padding: 1rem; font-size: 1rem; font-weight: 600; border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #a855f7); color: #fff;
            cursor: pointer; transition: all 0.2s; margin-bottom: 1rem; position: relative; overflow: hidden;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(99,102,241,0.4); }
        .btn:last-child { margin-bottom: 0; }
        .btn input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .json-box {
            display: none; background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
            padding: 1rem; max-height: 50vh; overflow: auto; font-family: 'SF Mono', monospace;
            font-size: 0.8125rem; line-height: 1.7; white-space: pre-wrap; word-break: break-word;
        }
        .json-box.active { display: block; }
        .json-key { color: #f472b6; }
        .json-string { color: #a5d6ff; }
        .json-boolean { color: #c4b5fd; }
        .json-number { color: #86efac; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="../" class="back">
            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M7.828 11H20v2H7.828l5.364 5.364-1.414 1.414L4 12l7.778-7.778 1.414 1.414z"/></svg>
            <span data-i18n="back">Назад</span>
        </a>
        <div class="actions">
            <button class="theme-btn" id="themeBtn">🌙</button>
            <button class="theme-btn lang-btn" id="langBtn" type="button" aria-label="Сменить язык">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10zm-2.29-2.333A17.9 17.9 0 0 1 8.027 13H4.062a8.008 8.008 0 0 0 5.648 6.667zM10.03 13c.151 2.439.848 4.73 1.97 6.752A15.905 15.905 0 0 0 13.97 13h-3.94zm9.908 0h-3.965a17.9 17.9 0 0 1-1.683 6.667A8.008 8.008 0 0 0 19.938 13zM4.062 11h3.965A17.9 17.9 0 0 1 9.71 4.333 8.008 8.008 0 0 0 4.062 11zm5.969 0h3.938A15.905 15.905 0 0 0 12 4.248 15.905 15.905 0 0 0 10.03 11zm4.259-6.667A17.9 17.9 0 0 1 15.973 11h3.965a8.008 8.008 0 0 0-5.648-6.667z"/></svg>
                <span class="lang-code" id="langCode">RU</span>
            </button>
        </div>
    </div>

    <h1 class="page-title" data-i18n="pageTitle">🛠️ RepoTools</h1>

    <section class="tool">
        <h2 class="tool__title" data-i18n="tool">JSON Парсер</h2>
    <div class="container">
        <div class="card">
            <h2 class="card__title" data-i18n="upload">📁 Загрузка JSON</h2>
            <button class="btn">
                <span data-i18n="choose">Выбрать файл</span>
                <input type="file" id="fileInput" accept=".json">
            </button>
            <button class="btn" id="parseBtn" data-i18n="parse">⬇️ Парсить и скачать</button>
        </div>
        <div class="card">
            <h2 class="card__title" data-i18n="preview">👁️ Предпросмотр</h2>
            <pre class="json-box" id="jsonBox"></pre>
        </div>
    </div>
    </section>

    <script>
        // Language (shared with the main site via localStorage)
        const DICT = {
            ru: { title: 'RepoTools | iApps', pageTitle: '🛠️ RepoTools', tool: 'JSON Парсер', back: 'Назад', upload: '📁 Загрузка JSON', choose: 'Выбрать файл',
                  parse: '⬇️ Парсить и скачать', preview: '👁️ Предпросмотр', aria: 'Сменить язык',
                  errParse: 'Ошибка парсинга JSON', errField: 'Загрузите JSON с полем appRepositories' },
            en: { title: 'RepoTools | iApps', pageTitle: '🛠️ RepoTools', tool: 'JSON Parser', back: 'Back', upload: '📁 Upload JSON', choose: 'Choose file',
                  parse: '⬇️ Parse and download', preview: '👁️ Preview', aria: 'Change language',
                  errParse: 'JSON parsing error', errField: 'Upload a JSON file with an appRepositories field' }
        };
        let lang = 'ru';
        try { const s = localStorage.getItem('lang'); if (s === 'ru' || s === 'en') lang = s; } catch (e) {}
        const t = (k) => DICT[lang][k];
        function applyLang() {
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
            document.getElementById('langCode').textContent = lang.toUpperCase();
            document.getElementById('langBtn').setAttribute('aria-label', t('aria'));
        }
        document.getElementById('langBtn').onclick = () => {
            lang = lang === 'ru' ? 'en' : 'ru';
            try { localStorage.setItem('lang', lang); } catch (e) {}
            applyLang();
        };
        applyLang();

        // Theme
        const html = document.documentElement;
        const themeBtn = document.getElementById('themeBtn');
        const saved = localStorage.getItem('theme') || 'dark';
        html.dataset.theme = saved;
        themeBtn.textContent = saved === 'dark' ? '☀️' : '🌙';
        
        themeBtn.onclick = () => {
            const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
            html.dataset.theme = next;
            localStorage.setItem('theme', next);
            themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
        };

        // JSON Parser
        let jsonData = null;
        const fileInput = document.getElementById('fileInput');
        const parseBtn = document.getElementById('parseBtn');
        const jsonBox = document.getElementById('jsonBox');

        fileInput.onchange = function() {
            const file = this.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    jsonData = JSON.parse(reader.result);
                    jsonBox.innerHTML = highlight(JSON.stringify(jsonData, null, 2));
                    jsonBox.classList.add('active');
                } catch { alert(t('errParse')); }
            };
            reader.readAsText(file);
        };

        function highlight(json) {
            return json.replace(
                /("(\\u[\da-fA-F]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+-]?\d+)?)/g,
                m => {
                    let c = 'json-number';
                    if (/^"/.test(m)) c = /:$/.test(m) ? 'json-key' : 'json-string';
                    else if (/true|false/.test(m)) c = 'json-boolean';
                    return `<span class="${c}">${m}</span>`;
                }
            );
        }

        parseBtn.onclick = () => {
            if (!jsonData?.appRepositories) return alert(t('errField'));
            const data = jsonData.appRepositories.map(a => ({
                appName: a.appName, appImage: a.appImage, appVersion: a.appVersion,
                appDescription: a.appDescription, appUpdateTime: a.appUpdateTime
            }));
            const blob = new Blob([JSON.stringify(data, null, 4)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'Repo.json';
            a.click();
        };
    </script>
</body>
</html>
